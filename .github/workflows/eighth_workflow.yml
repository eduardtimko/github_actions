name: 'Eighth workflow'
on:
  workflow_dispatch:
    inputs:
      titleCustom:
        type: string
        description: Title
        required: true
        default: "Hello world"

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: "Print values from titleCustom"
        run: echo "Title ${{ inputs.titleCustom }}"
